# Bei jedem Push: kompilieren und testen (Linux, schnell) – der Windows-Build läuft beim Release.
name: Prüfen

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Systembibliotheken
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Windows-Ziel kompiliert
        working-directory: src-tauri
        run: |
          sudo apt-get install -y mingw-w64
          cargo check --target x86_64-pc-windows-gnu
